; AR-AI-Glasses 配置示例
;
; 用法: cp config.example.ini config.ini，然后按自己的硬件改。
; config.ini 已经在 .gitignore 里，不会被提交。
;
; 每一项都可以用环境变量覆盖，规则是「AR_ + 键名大写 + 点换下划线」:
;   api.token       -> AR_API_TOKEN
;   camera.device   -> AR_CAMERA_DEVICE
; 优先级: 环境变量 > 本文件 > 程序内置默认值
;
; 配置文件本身也可以换个位置，用 AR_CONFIG_FILE 指定。

[api]
; 【必填】云端模型的 API 密钥。
;
; 强烈建议不要写在这里，而是用环境变量:
;     export AR_API_TOKEN='sk-xxxxxxxx'
; 写进文件的风险是一旦手滑 git add -f 就泄漏了，
; 而密钥一旦进过 git 历史，删文件是没有用的，只能去控制台吊销重发。
token =

; OpenAI 兼容的 chat/completions 端点。换服务商只需要改这两行。
url = https://api.siliconflow.cn/v1/chat/completions
model = Qwen/Qwen3-VL-32B-Thinking

; 单张图片的细节级别: low / high / auto。
; high 每张图消耗的 token 是 low 的好几倍，20 张图很容易撞上单次请求上限，
; 表现就是一个看不懂的 400。默认 low，确实需要看清细节再改 high。
image_detail = low

; 整个请求的超时(秒)。带 Thinking 的模型推理慢，给足一点。
timeout_sec = 120
; 建立连接的超时(秒)，比总超时短得多，用来快速发现网络不通。
connect_timeout_sec = 10
; 遇到 429 限流或 5xx 时的重试次数，按 1s/2s/4s 指数退避。
max_retries = 2

[camera]
; 摄像头节点。用 v4l2-ctl --list-devices 查。
device = /dev/video0
; 期望分辨率。驱动不支持时会自动协商成最接近的，程序按实际值工作。
width = 640
height = 480
; 每隔多少毫秒留一帧
interval_ms = 500
; 一次采集持续多少毫秒。默认 10 秒 / 500ms = 约 20 帧。
; 注意帧数直接决定请求体大小和 token 消耗，别随意调大。
duration_ms = 10000
; JPEG 质量 1..100。85 是画质和体积的常用平衡点。
jpeg_quality = 85
; V4L2 缓冲区个数，4 个足够，太少会丢帧。
buffer_count = 4

[audio]
; 录音设备。default 走 ALSA 默认设备，通常就能用；
; 要指定具体声卡就用 hw:<卡号>,<设备号>，用 arecord -l 查。
device = default
; 录音时长(秒)，和 camera.duration_ms 对应上比较自然。
duration_sec = 10

[whisper]
; 【必填】ggml 格式的模型文件路径。
; 用 whisper.cpp 自带脚本下载: bash models/download-ggml-model.sh base
model_path =
; 识别语言。zh=中文, en=英文, auto=自动检测(略慢且偶尔认错)。
language = zh
; 是否用 GPU。嵌入式板子上通常没有可用后端，保持 false。
use_gpu = false
; 推理线程数。留空则默认取 CPU 核心数的一半——
; 另一半要留给同时在跑的图像采集和 JPEG 压缩。
; threads = 4

[display]
; DRM 设备节点。多显卡机器上可能是 card1。
card = /dev/dri/card0
; 字体文件。留空则自动在常见的 Noto CJK / 文泉驿路径里找。
; 显示中文必须用中文字体，DejaVu 之类只有拉丁字符，中文会显示成空白框。
font_path =
font_size = 28
; 文字区域距屏幕边缘的留白(像素)
margin_x = 40
margin_y = 60
; 背景色和文字色，十进制或 0x 十六进制的 RGB。
; AR 场景下深色背景 + 亮色文字对比度最好。
bg_rgb = 0x000000
fg_rgb = 0xFFFFFF
